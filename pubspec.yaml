name: ilmalogiya
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+12

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  loader_overlay: ^5.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  keyboard_dismisser: ^3.0.0
  adaptive_theme: ">=3.7.2 <3.8.0"
  http: ^1.6.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  photo_opener: ^0.3.2
  app_links: ^7.2.2
  share_plus: ^13.3.1
  flutter_blurhash: ^0.9.1
  sqflite: ^2.4.4
  path: ^1.9.1
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  build_runner: ^2.16.2
  freezed: ^4.0.2
  flutter_gen_runner: ^5.15.0
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: 'ic_launcher'
  ios: true
  image_path: 'assets/logos/logo.png'
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: 'assets/logos/logo.png'

flutter_native_splash:
  color: "#f5e6cc"
  image: assets/logos/logo_banner_bigger.png
  color_dark: "#ffffff"
  image_dark: assets/logos/logo_banner_bigger.png

  android_12:
    image: assets/logos/logo_banner.png
    icon_background_color: "#f5e6cc"
    image_dark: assets/logos/logo_banner.png
    icon_background_color_dark: "#ffffff"

